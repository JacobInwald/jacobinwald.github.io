[project]
name = "jacobinwald-site"
version = "0.1.0"
description = "Personal website and blog for Jacob Inwald, built with Python and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jacob Inwald", email = "Jacob.Inwald@Hotmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "markdown>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["app", "build.py", "run.py"]
