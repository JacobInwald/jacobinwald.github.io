{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 2rem;">
  <h1 style="font-size: 2rem; color: var(--gruv-yellow); margin: 0.5rem 0 1.5rem;">
    Articles &amp; Writing
  </h1>
</div>

{% for post in posts %}
<div class="content-card">
  <div style="font-size: 0.85rem; color: var(--fg-muted); margin-bottom: 0.35rem;">
    Published {{ post.date }} &bull; {{ post.read_time }}
  </div>
  <h2 style="font-size: 1.35rem; margin: 0 0 0.5rem;">
    <a href="/blog/{{ post.slug }}/" class="text-bright">{{ post.title }}</a>
  </h2>
  <p style="color: var(--fg-muted); margin-bottom: 1rem;">{{ post.summary }}</p>

  <div>
    {% for tag in post.tags %}
    <span class="badge-tag">{{ tag }}</span>
    {% endfor %}
  </div>

  <div style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem;">
    <a href="/blog/{{ post.slug }}/" class="text-yellow">Read Article &rarr;</a>
  </div>
</div>
{% endfor %}
{% endblock %}
