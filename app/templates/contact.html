{% extends "base.html" %}

{% block content %}
<section class="contact-container">
  <div style="text-align: center; margin-bottom: 3rem;">
    <h1 class="hero-title">Get in Touch</h1>
    <p class="hero-description">
      Interested in collaborating, discussing Python architecture, or technical opportunities? Send a message below.
    </p>
  </div>

  <div class="card" style="padding: 2.5rem;">
    <form id="contact-form">
      <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-input" placeholder="Your Name" required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="subject" class="form-label">Subject</label>
        <input type="text" id="subject" class="form-input" placeholder="Project Inquiry / Hello" required>
      </div>

      <div class="form-group">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" rows="5" class="form-textarea" placeholder="How can I help you?" required></textarea>
      </div>

      <div id="form-feedback" style="display: none; margin-bottom: 1.5rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm);"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
        Send Message &rarr;
      </button>
    </form>
  </div>
</section>
{% endblock %}
