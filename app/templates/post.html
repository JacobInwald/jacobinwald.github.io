{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 1.5rem;">
  <a href="/blog" class="text-blue">&larr; :e blog.md (back to index)</a>
</div>

<div class="content-card" style="padding: 2.25rem;">
  <div style="font-size: 0.85rem; color: var(--fg-muted); margin-bottom: 0.5rem;">
    # {{ post.date }} &bull; {{ post.read_time }}
  </div>
  <h1 style="font-size: 2.2rem; color: var(--fg-bright); margin-bottom: 1rem;">{{ post.title }}</h1>

  <div style="margin-bottom: 1.5rem;">
    {% for tag in post.tags %}
    <span class="badge-tag">{{ tag }}</span>
    {% endfor %}
  </div>

  <div class="post-article" style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
    {{ post.content_html | safe }}
  </div>
</div>
{% endblock %}
